services:
  - type: web
    name: ahariva-hissab
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/session
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_PASSWORD
        sync: false
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
